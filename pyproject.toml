[project]
name = "ai-knowledge-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.29.0",
    "openai>=3.26.1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
ai-copilot = "ai_knowledge_copilot.cli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
